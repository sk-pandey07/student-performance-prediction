<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Prediction Result</h1>

    <h2>Predicted Marks: {{ prediction }}</h2>

    <h2>Grade: {{ grade }}</h2>

    <h3>Suggestions:</h3>

    <ul>
        {% for s in suggestions %}
            <li>{{ s }}</li>
        {% endfor %}
    </ul>

    <a href="/">Try Again</a>

</div>

</body>
</html>
