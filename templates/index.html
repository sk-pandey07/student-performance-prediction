<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>AI Student Performance Predictor</h1>

    <form action="/predict" method="POST">

        <input type="number" name="attendance" placeholder="Attendance %" required>

        <input type="number" name="study_hours" placeholder="Study Hours" required>

        <input type="number" name="previous_marks" placeholder="Previous Marks" required>

        <input type="number" name="sleep_hours" placeholder="Sleep Hours" required>

        <label>Internet Access:</label>
        <select name="internet_access">
            <option value="1">Yes</option>
            <option value="0">No</option>
       </select>

        <label>Tuition:</label>
        <select name="tuition">
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Extracurricular Activities:</label>
        <select name="extracurricular">
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <input type="number" step="0.1" name="screen_time" placeholder="Screen Time">

        <input type="number" name="assignments_completed" placeholder="Assignments Completed">

        <button type="submit">Predict Performance</button>

    </form>

</div>

</body>
</html>
